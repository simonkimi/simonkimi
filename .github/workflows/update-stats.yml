name: Update README cards

on:
  schedule:
    # 09:17 Asia/Shanghai on days 1, 4, 7, ... of each month.
    - cron: "17 1 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme-cards
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Check private repository token
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: |
          if [ -z "$GH_STATS_TOKEN" ]; then
            echo "::error::Add the GH_STATS_TOKEN repository secret to include private repositories."
            exit 1
          fi

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&hide=html,cmake&langs_count=6&theme=github_dark&exclude_repo=ink-firmware,BtsUds
          path: profile/top-langs.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Version card and update README
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import uuid

          card = Path("profile/top-langs.svg")
          versioned_card = card.with_name(f"top-langs-{uuid.uuid4().hex}.svg")
          readme = Path("README.adoc")
          content, count = re.subn(
              r"(?m)^image::profile/top-langs(?:-[0-9a-f]{32})?\.svg(?=\[)",
              f"image::{versioned_card.as_posix()}",
              readme.read_text(encoding="utf-8"),
          )
          if count != 1:
              raise SystemExit("Expected exactly one language card reference in README.adoc")

          card.rename(versioned_card)
          readme.write_text(content, encoding="utf-8")
          for old_card in card.parent.glob("top-langs-*.svg"):
              if old_card != versioned_card and re.fullmatch(r"top-langs-[0-9a-f]{32}\.svg", old_card.name):
                  old_card.unlink()
          PY

      - name: Commit updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- README.adoc 'profile/top-langs*.svg'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update language stats"
          git push
