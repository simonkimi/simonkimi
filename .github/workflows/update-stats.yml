name: Update README cards

on:
  schedule:
    # 09:17 Asia/Shanghai on days 1, 4, 7, ... of each month.
    - cron: "17 1 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme-cards
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Check private repository token
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: |
          if [ -z "$GH_STATS_TOKEN" ]; then
            echo "::error::Add the GH_STATS_TOKEN repository secret to include private repositories."
            exit 1
          fi

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&hide=html,cmake&langs_count=6&theme=github_dark
          path: profile/top-langs.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Commit updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/top-langs.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update language stats"
          git push
